<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Theme & Color Scheme -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#059669" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <meta name="color-scheme" content="light dark" />
    
    <!-- SEO & Metadata -->
    <title>Kişisel Finans - Akıllı Bütçe, Fiş ve Harcama Takibi</title>
    <meta name="description" content="Fiş tara, sesle harcama kaydet, bütçeni, borçlarını ve yatırımlarını tek noktadan profesyonelce yönet." />
    <meta name="keywords" content="finans, bütçe, harcama takibi, kişisel muhasebe, fiş tarama, yatırım portföyü, pwa" />
    
    <!-- Web App Manifest (Standard & Alternate) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="alternate" type="application/json" href="/manifest.json" />
    
    <!-- Standard PWA Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Kişisel Finans" />
    
    <!-- iOS Safari PWA Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kişisel Finans" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="mask-icon" href="/icon.svg" color="#059669" />
    
    <!-- Microsoft / Windows Tile Meta -->
    <meta name="msapplication-TileColor" content="#059669" />
    <meta name="msapplication-TileImage" content="/icon-512.png" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="msapplication-navbutton-color" content="#059669" />
    <meta name="msapplication-starturl" content="/?source=pwa" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-emerald-100 selection:text-emerald-900 font-sans min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Enhanced Service Worker Registration & PWA Utilities
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .then((registration) => {
              console.log('[PWA] Service Worker registered with scope:', registration.scope);

              // Check for background sync support
              if ('sync' in registration) {
                registration.sync.register('sync-finans-data').catch(() => {});
              }

              // Check for periodic background sync support
              if ('periodicSync' in registration) {
                registration.periodicSync.register('daily-rate-check', {
                  minInterval: 24 * 60 * 60 * 1000 // 1 day
                }).catch(() => {});
              }

              // Detect Service Worker updates
              registration.onupdatefound = () => {
                const installingWorker = registration.installing;
                if (!installingWorker) return;
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[PWA] Yeni sürüm mevcut, otomatik güncellenebilir.');
                  }
                };
              };
            })
            .catch((error) => {
              console.warn('[PWA] Service Worker registration failed:', error);
            });
        });
      }

      // Capture beforeinstallprompt event for PWA installation UI
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-install-ready'));
      });

      // App installed listener
      window.addEventListener('appinstalled', () => {
        window.deferredPrompt = null;
        console.log('[PWA] Kişisel Finans başarıyla cihaza yüklendi.');
      });
    </script>
  </body>
</html>
