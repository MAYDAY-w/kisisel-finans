<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#064e3b" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.2" />

  <!-- Wallet / Finance Emblem -->
  <g transform="translate(96, 116)" filter="url(#shadow)">
    <!-- Wallet Body -->
    <rect x="0" y="30" width="320" height="230" rx="36" fill="#ffffff" />
    <!-- Wallet Top Pocket Flap -->
    <path d="M 0 70 C 0 46, 20 28, 44 28 L 276 28 C 300 28, 320 46, 320 70 L 320 95 L 0 95 Z" fill="#ecfdf5" opacity="0.9" />
    <!-- Wallet Clasp -->
    <rect x="220" y="105" width="100" height="74" rx="20" fill="#047857" />
    <!-- Clasp Metal Button -->
    <circle cx="270" cy="142" r="14" fill="#34d399" />
    <circle cx="270" cy="142" r="6" fill="#ffffff" />
    <!-- Upward Trend Arrow -->
    <path d="M 50 190 L 105 135 L 145 170 L 195 115" fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 170 115 L 195 115 L 195 140" fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
