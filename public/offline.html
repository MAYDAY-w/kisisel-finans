<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Çevrimdışı Mod - Kişisel Finans</title>
  <meta name="theme-color" content="#059669" />
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #059669;
      --primary-hover: #047857;
      --border: #334155;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text: #0f172a;
        --text-muted: #64748b;
        --primary: #059669;
        --primary-hover: #047857;
        --border: #e2e8f0;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
    .icon-container {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      background: rgba(5, 150, 105, 0.15);
      border-radius: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }
    .icon-container svg {
      width: 36px;
      height: 36px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      background: rgba(234, 179, 8, 0.15);
      color: #eab308;
      border: 1px solid rgba(234, 179, 8, 0.3);
      margin-bottom: 1rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background-color: var(--primary);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.85rem 1.25rem;
      border-radius: 0.875rem;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn:hover {
      background-color: var(--primary-hover);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .note {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M8.5 8.5A6 6 0 0112 7.5c1.66 0 3.16.67 4.24 1.76M5 12a10 10 0 0114 0M1.5 6.5A15 15 0 0122.5 6.5M12 18.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3z" />
      </svg>
    </div>

    <div class="badge">
      ⚡ Çevrimdışı Mod
    </div>

    <h1>İnternet Bağlantısı Yok</h1>
    <p>
      Şu anda çevrimdışısınız. Ancak endişelenmeyin, daha önce kaydettiğiniz tüm finansal verileriniz cihazınızda güvenle saklanmaktadır.
    </p>

    <button class="btn" onclick="window.location.reload()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      Bağlantıyı Yeniden Dene
    </button>

    <div class="note">
      Kişisel Finans PWA • İnternet geldiğinde otomatik güncellenir
    </div>
  </div>

  <script>
    // Online durumuna geçildiğinde sayfayı otomatik yenile
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
